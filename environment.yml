name: fluxforge
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - pytest
  - black=24.10.*
  - flake8=7.3.*
  - numpy=1.26.*
  - scipy
  - pandas
  - matplotlib-base
  - pillow
  - pyyaml
  - h5py
  - lxml
  - pycairo
  - pango
  - pyside6>=6.6
  - pyqtgraph>=0.13
  - pip:
      - -e .[dev,native-gui,gui-test,ml,bundle,reporting]
      - tensorflow==2.15.1
      - pyunfold==0.5.0
