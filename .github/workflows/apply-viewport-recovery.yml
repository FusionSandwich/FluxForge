name: Apply viewport recovery patch

on:
  push:
    branches:
      - recovery-validation
    paths:
      - .github/fluxforge_viewport_recovery_fix.patch
      - .github/workflows/apply-viewport-recovery.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-validation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed patch
        run: |
          git apply --check .github/fluxforge_viewport_recovery_fix.patch
          git apply .github/fluxforge_viewport_recovery_fix.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fluxforge/gui/analysis_workspace.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    (
                        active_role is not None
                        and previous_active_id in active_role.spectrum_ids
                    )'''
          new = '''                    (
                        active_role is not None
                        and bool(active_role.spectrum_ids)
                        and active_role.spectrum_ids[0] == previous_active_id
                    )'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one active-role condition to refine')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Compile changed Python files
        run: |
          python -m compileall -q \
            src/fluxforge/gui/analysis_workspace.py \
            src/fluxforge/gui/backends/pyqtgraph_backend.py \
            tests/test_analysis_workspace_qt.py \
            tests/test_bgamma_canvas_integration_qt.py \
            tests/test_inl_background_interfaces.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'Jinja2>=3.1'

      - name: Run non-window regression checks
        run: |
          python -m pytest -q \
            tests/test_analysis_workspace_qt.py::test_active_spectrum_follows_first_and_reassigned_foreground \
            tests/test_inl_background_interfaces.py::test_inl_cli_subtraction_and_invalid_coverage

      - name: Commit and push reviewed changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/fluxforge/gui/analysis_workspace.py \
            src/fluxforge/gui/backends/pyqtgraph_backend.py \
            tests/test_analysis_workspace_qt.py \
            tests/test_bgamma_canvas_integration_qt.py \
            tests/test_inl_background_interfaces.py
          git rm \
            .github/fluxforge_viewport_recovery_fix.patch \
            .github/workflows/apply-viewport-recovery.yml
          git diff --cached --check
          git commit -m 'Fix viewport recovery after reset and session reload'
          git push origin HEAD:recovery-validation
