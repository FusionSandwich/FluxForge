name: Apply viewport recovery patch

on:
  push:
    branches:
      - recovery-validation
    paths:
      - .github/fluxforge_viewport_recovery_fix.patch
      - .github/workflows/apply-viewport-recovery.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-validation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed patch
        run: |
          git apply --check .github/fluxforge_viewport_recovery_fix.patch
          git apply .github/fluxforge_viewport_recovery_fix.patch
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/fluxforge/gui/analysis_workspace.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)active_role is not None\n'
              r'(?P=indent)and previous_active_id in active_role\.spectrum_ids$'
          )

          def replacement(match: re.Match[str]) -> str:
              indent = match.group('indent')
              return (
                  f'{indent}active_role is not None\n'
                  f'{indent}and bool(active_role.spectrum_ids)\n'
                  f'{indent}and active_role.spectrum_ids[0] == previous_active_id'
              )

          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(
                  f'Expected exactly one active-role condition to refine; found {count}'
              )
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Compile changed Python files
        run: |
          python -m compileall -q \
            src/fluxforge/gui/analysis_workspace.py \
            src/fluxforge/gui/backends/pyqtgraph_backend.py \
            tests/test_analysis_workspace_qt.py \
            tests/test_bgamma_canvas_integration_qt.py \
            tests/test_inl_background_interfaces.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'Jinja2>=3.1'

      - name: Validate active-spectrum projection without GUI panel imports
        run: |
          python - <<'PY'
          import numpy as np

          from fluxforge.gui.analysis_workspace import AnalysisWorkspaceController
          from fluxforge.io.spe import GammaSpectrum

          def spectrum(spectrum_id: str, offset: float) -> GammaSpectrum:
              counts = np.array([1.0, 2.0, 3.0], dtype=float) + offset
              return GammaSpectrum(
                  counts=counts,
                  counts_uncertainty=np.sqrt(counts),
                  channels=np.arange(counts.size, dtype=float),
                  live_time=10.0,
                  real_time=10.0,
                  spectrum_id=spectrum_id,
              )

          controller = AnalysisWorkspaceController()
          first_key = controller.register_loaded_spectrum(
              spectrum('first-spectrum', 0.0),
              label='first.spe',
              source_path='/tmp/first.spe',
          )
          controller.assign_loaded_spectrum_to_slot(first_key, 'foreground')
          assert controller.document.active_spectrum_id == first_key

          second_key = controller.register_loaded_spectrum(
              spectrum('second-spectrum', 1.0),
              label='second.spe',
              source_path='/tmp/second.spe',
          )
          assert controller.document.active_spectrum_id == first_key
          controller.assign_loaded_spectrum_to_slot(second_key, 'foreground')
          assert controller.document.active_spectrum_id == second_key

          foreground = next(
              role
              for role in controller.document.spectrum_roles
              if role.role == 'foreground'
          )
          assert foreground.spectrum_ids[0] == second_key
          PY

      - name: Run focused background interface checks
        run: |
          python -m pytest -q \
            tests/test_inl_background_interfaces.py::test_inl_cli_subtraction_and_invalid_coverage

      - name: Commit and push reviewed changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/fluxforge/gui/analysis_workspace.py \
            src/fluxforge/gui/backends/pyqtgraph_backend.py \
            tests/test_analysis_workspace_qt.py \
            tests/test_bgamma_canvas_integration_qt.py \
            tests/test_inl_background_interfaces.py
          git rm \
            .github/fluxforge_viewport_recovery_fix.patch \
            .github/workflows/apply-viewport-recovery.yml
          git diff --cached --check
          git commit -m 'Fix viewport recovery after reset and session reload'
          git push origin HEAD:recovery-validation
