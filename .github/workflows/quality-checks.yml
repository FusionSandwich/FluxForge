name: Quality Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - add_gui
      - chore/folder-audit-native-gui-review-20260317
    paths:
      - 'src/fluxforge/**/*.py'
      - 'src/fluxforge_gui/**/*.py'
      - 'tests/**/*.py'
      - '.flake8'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'README.md'
      - 'docs/**/*.md'
      - '.github/workflows/quality-checks.yml'

jobs:
  core-analysis:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling and runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Black (check)
        run: |
          black --check \
            src/fluxforge/k0_physics.py \
            src/fluxforge/analysis/astm_e261.py \
            src/fluxforge/analysis/astm_e262.py \
            src/fluxforge/data/isotope_names.py \
            src/fluxforge/io/metadata.py \
            tests/test_io_metadata.py \
            tests/test_k0_physics.py \
            tests/test_k0_naa.py \
            tests/test_k0_workflow.py \
            tests/test_kayzero_k0.py \
            tests/test_rafm_workflow.py \
            tests/test_rafm_background_integration.py \
            tests/test_flux_wire_analysis.py \
            tests/test_flux_wire_parity.py \
            tests/test_peak_count_method_benchmark.py \
            tests/test_genie_overrides.py \
            tests/test_pipeline_validation.py \
            tests/test_astm_e261.py \
            tests/test_astm_e262.py \
            tests/test_cli_app.py

      - name: Flake8 (baseline scope)
        run: |
          flake8 \
            src/fluxforge/k0_physics.py \
            src/fluxforge/data/isotope_names.py \
            src/fluxforge/io/metadata.py \
            tests/test_io_metadata.py

      - name: Tracker and GUI scaffold checks
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_plugin_registry.py \
            tests/test_project_tracker_assets.py \
            tests/test_implementation_steps.py \
            tests/test_modern_gui_shell.py

      - name: Targeted k0 regression tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_k0_physics.py tests/test_k0_naa.py tests/test_k0_workflow.py tests/test_kayzero_k0.py

      - name: RAFM workflow regression tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_rafm_workflow.py \
            tests/test_rafm_background_integration.py \
            tests/test_flux_wire_analysis.py \
            tests/test_flux_wire_parity.py \
            tests/test_peak_count_method_benchmark.py \
            tests/test_genie_overrides.py \
            tests/test_pipeline_validation.py

      - name: CLI and standards regression tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_astm_e261.py \
            tests/test_astm_e262.py \
            tests/test_cli_app.py \
            -W error::matplotlib.MatplotlibDeprecationWarning

  modern-native-gui:
    name: Modern GUI Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux native GUI runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0

      - name: Install modern GUI deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,native-gui]'
          python -m pip install "Jinja2>=3.1"

      - name: GUI scaffold regression tests
        run: pytest -q tests/test_modern_gui_shell.py tests/test_project_tracker_assets.py

      - name: Analysis workspace core helper tests
        run: |
          pytest -q \
            tests/test_analysis_workspace_qt.py::test_analysis_core_helpers_cover_workspace_surfaces \
            tests/test_analysis_workspace_qt.py::test_efficiency_models_and_activity_results_are_available \
            tests/test_analysis_workspace_qt.py::test_line_match_browser_and_gamma_phenomena_estimates_are_available \
            tests/test_analysis_workspace_qt.py::test_analysis_workspace_tracks_loaded_spectra_and_role_assignments

      - name: Analysis workspace peak table workflow test
        run: |
          pytest -q tests/test_analysis_workspace_qt.py::test_main_window_peak_workflow_supports_undo_pin_tag_and_selection_sync

      - name: Analysis workspace peak assignment workflow test
        run: |
          pytest -q \
            tests/test_analysis_workspace_qt.py::test_peak_id_browser_supports_manual_isotope_reassignment \
            tests/test_analysis_workspace_qt.py::test_peak_id_browser_supports_clearing_manual_assignment

      - name: Analysis workspace peak browser tests
        run: |
          pytest -q \
            tests/test_analysis_workspace_qt.py::test_peak_id_browser_supports_typed_centroid_filtering_and_phenomena_guides \
            tests/test_analysis_workspace_qt.py::test_peak_id_browser_use_selected_peak_button_restores_peak_centroid

      - name: Analysis workspace survey and overlay tests
        run: |
          pytest -q \
            tests/test_analysis_workspace_qt.py::test_main_window_activity_background_and_survey_map_workflows \
            tests/test_analysis_workspace_qt.py::test_main_window_background_selector_updates_subtracted_foreground_and_overlay

      - name: Calibration workspace Qt tests
        run: pytest -q tests/test_calibration_workspace_qt.py

      - name: Unfolding workspace Qt tests
        run: pytest -q tests/test_unfolding_workspace_qt.py

      - name: Module 3 workflow Qt tests
        run: pytest -q tests/test_module3_workflows_qt.py

      - name: Predictive dashboard Qt tests
        run: pytest -q tests/test_predictive_dashboard_qt.py

  native-desktop-gui-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux desktop GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth imagemagick
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,gui-test]'

      - name: Legacy desktop GUI acceptance (Linux/Xvfb)
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_gui_app.py \
            tests/test_gui_desktop_native.py \
            -W error::matplotlib.MatplotlibDeprecationWarning

      - name: Build Linux legacy GUI evidence bundle
        env:
          PYTHONPATH: src
          FLUXFORGE_OFFLINE: '1'
        run: |
          xvfb-run -a python tests/gui_desktop_driver.py artifacts/gui_review/linux

      - name: Upload Linux legacy GUI evidence
        uses: actions/upload-artifact@v4
        with:
          name: fluxforge-gui-legacy-review-linux
          path: artifacts/gui_review/linux

  native-desktop-gui-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Windows desktop GUI deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui-test]"

      - name: Legacy desktop GUI acceptance (Windows)
        env:
          PYTHONPATH: src
          FLUXFORGE_OFFLINE: '1'
        run: |
          pytest -q tests/test_gui_desktop_native.py

      - name: Build Windows legacy GUI evidence bundle
        env:
          PYTHONPATH: src
          FLUXFORGE_OFFLINE: '1'
        run: |
          python tests/gui_desktop_driver.py artifacts/gui_review/windows

      - name: Upload Windows legacy GUI evidence
        uses: actions/upload-artifact@v4
        with:
          name: fluxforge-gui-legacy-review-windows
          path: artifacts/gui_review/windows
