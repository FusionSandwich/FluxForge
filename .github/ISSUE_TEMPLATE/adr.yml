name: Architecture Decision Record
description: Propose or revise a formal architectural decision.
title: "[ADR]: "
labels: ["type/adr", "area/adr", "priority/p0-blocking"]
body:
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Proposed
        - Accepted
        - Superseded
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Decision Rationale
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Rejected
