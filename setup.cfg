[metadata]
name = fluxforge
version = 0.1.0
description = UWNR Flux-Wire-Driven Neutron Spectrum Reconstruction Tool
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
install_requires =
    numpy>=1.26,<2.0
    scipy>=1.11
    pandas>=2.1
    matplotlib>=3.8
    pillow>=10.0
    PyYAML>=6.0
    h5py>=3.10
python_requires = >=3.11
include_package_data = True

[options.extras_require]
dev =
    pytest>=8.0
    black==24.10.*
    flake8==7.3.*
ml =
    tensorflow==2.15.1
bundle =
    pyinstaller>=6.0

[options.packages.find]
where = src

[options.package_data]
fluxforge =
    data/*.json
